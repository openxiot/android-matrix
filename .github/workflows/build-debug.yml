name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        # v6 起缓存走闭源的 gradle-actions-caching 组件（Gradle Terms of Use，非 MIT）；
        # v5 已是 node24，够用且缓存仍开源。要升 v6 需先接受那份 ToU。
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 放在打包之前：单元测试跑得快、失败得早，而且这里的 i18n 门禁
      # （中英资源对账、有没有漏抽的硬编码中文）不看的话就是形同虚设 ——
      # 漏翻的表现是英文界面上冒出一句中文，只有跑到那一屏才看得见。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload test report
        # 失败时也要能看到是哪个 key 漏了、哪个文件漏抽了
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/


      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
